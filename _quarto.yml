project:
  type: website
  render:
    - "*.qmd"
    - "!fable5_improve/"

website:
  title: "Kezhou Xiao"
  description: "Research on China's political economy, state-business relations, cadre policy, and party-state transformation by Kezhou Xiao, Research Assistant Professor at Sun Yat-sen University"
  site-url: "https://kezhouxiao.github.io"
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: book-project.qmd
        text: Book Project
